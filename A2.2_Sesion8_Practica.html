<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Practice Session</title>
<!--
  ============================================================================
  GT PRACTICE BOILERPLATE v1 · Gabriel Turner English Training
  ----------------------------------------------------------------------------
  Sesión de Práctica autodidacta (20-30 min). Se edita ÚNICAMENTE el objeto
  PRACTICE al inicio del <script>. Mobile-first.
  REGLA DURA: ninguna respuesta visible por default. Todo bajo acordeón.
  Vocabulario y gramática SIEMPRE los mismos de la Sesión Principal.
  Audio: si clip.src está vacío se activa una voz provisional del navegador
  y se avisa en pantalla. Al llegar el MP3 se pega en src como data URI
  base64 y el aviso desaparece solo.
  Contenido de ejemplo: B1.1 · Sesión 7 · "Is AI Going to Take My Job?"
  ============================================================================
-->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gt-green-deep:#0E5C43; --gt-green:#12B886; --gt-copper:#D96A28;
    --paper:#F7F4EC; --paper-soft:#EFEADD; --line:#DCD5C4;
    --ink:#15181F; --ink-soft:#4A4E5A; --navy:#0B0F17; --white:#fff;
    --green-ok:#12A150; --red-no:#D93025;
    --accent:#00C2A0; --accent-dark:#00947A;
    --coral:#FF5A5F; --coral-dark:#B7311B; --amber:#FFB020; --amber-dark:#B8790A;
    --violet:#6C5CE7; --violet-soft:#F3F0FF;
    --radius-block:22px; --radius-card:16px; --radius-pill:999px;
    --shadow:0 8px 24px rgba(11,15,23,.07); --shadow-lg:0 16px 40px rgba(11,15,23,.13);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; font-family:'Manrope',system-ui,sans-serif; background:var(--paper); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased; padding-bottom:76px; font-size:15px;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px;}
  .hidden{display:none !important;}
  h2 svg,h3 svg,h4 svg,h5 svg{width:17px; height:17px; flex-shrink:0;}

  /* ===== TOP BAR ===== */
  .top{position:sticky; top:0; z-index:50; background:rgba(11,15,23,.97); color:#fff;
    backdrop-filter:blur(10px);}
  .top-in{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .mark{width:26px; height:26px; border-radius:8px; flex-shrink:0; color:var(--navy); font-size:10.5px;
    background:linear-gradient(135deg,var(--gt-green),var(--accent));
    display:flex; align-items:center; justify-content:center; font-weight:800;}
  .top b{font-size:11.5px; letter-spacing:.5px; font-weight:800;}
  .lvl{margin-left:auto; font-size:11px; font-weight:800; padding:4px 10px; border-radius:var(--radius-pill);
    background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent);
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent); white-space:nowrap;}
  .rail{height:4px; background:rgba(255,255,255,.12);}
  .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--gt-green),var(--accent)); transition:width .35s ease;}

  /* ===== HERO ===== */
  .hero{background:radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 50%),
      linear-gradient(140deg,var(--gt-green-deep),#10151F 70%,var(--navy));
    color:#fff; padding:30px 0 34px;}
  .hero .kick{font-size:10px; text-transform:uppercase; letter-spacing:1.4px; font-weight:800;
    color:rgba(255,255,255,.6); margin:0 0 8px;}
  .hero h1{margin:0 0 10px; font-size:clamp(24px,7vw,34px); font-weight:800; letter-spacing:-.6px; line-height:1.15;}
  .hero h1 em{color:var(--accent); font-style:normal;}
  .hero p{margin:0; font-size:14.5px; color:rgba(255,255,255,.75);}
  .hero .how{margin-top:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    border-radius:14px; padding:14px 16px; font-size:13.5px; color:rgba(255,255,255,.85);}
  .hero .how b{color:#fff;}

  /* ===== SECTION ===== */
  .sect{background:#fff; border:1px solid var(--line); border-radius:var(--radius-block);
    padding:22px 18px; margin:18px 0; box-shadow:var(--shadow);}
  .sect.big{border:2px solid #FFDCC9; background:linear-gradient(180deg,#FFF9F5,#fff);}
  .sect.dark{background:linear-gradient(140deg,#12161F,#1B1030); color:#fff; border:none;}
  .s-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:6px;}
  .s-ico{width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .s-ico svg{width:19px; height:19px;}
  .s-num{font-size:10px; text-transform:uppercase; letter-spacing:1.2px; font-weight:800; color:var(--ink-soft); margin:1px 0 2px;}
  .s-title{font-size:clamp(19px,5vw,24px); font-weight:800; margin:0; letter-spacing:-.3px;}
  .s-time{margin-left:auto; font-size:10.5px; font-weight:800; background:var(--paper-soft);
    border:1px solid var(--line); color:var(--ink-soft); padding:4px 9px; border-radius:var(--radius-pill); white-space:nowrap;}
  .sect.dark .s-time{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:rgba(255,255,255,.75);}
  .s-desc{color:var(--ink-soft); font-size:14px; margin:10px 0 18px;}
  .sect.dark .s-desc{color:rgba(255,255,255,.65);}

  /* ===== FLASHCARDS ===== */
  .fc-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
    font-size:12.5px; font-weight:800; color:var(--ink-soft);}
  .fc-bar .pill{background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent-dark);
    border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    padding:4px 11px; border-radius:var(--radius-pill); font-variant-numeric:tabular-nums;}
  .fc-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .fc-tabs button{background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); cursor:pointer;
    padding:7px 13px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:800;}
  .fc-tabs button.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .fc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px;}
  .fc{background:var(--paper-soft); border:1.5px solid var(--line); border-radius:var(--radius-card);
    padding:16px 14px; cursor:pointer; text-align:left; min-height:118px; display:flex; flex-direction:column;
    transition:all .18s ease; position:relative;}
  .fc:hover{border-color:var(--accent-dark); transform:translateY(-2px);}
  .fc .tap{font-size:9.5px; text-transform:uppercase; letter-spacing:.9px; font-weight:800; color:#B3AC98;}
  .fc .w{font-size:16px; font-weight:800; margin:6px 0 0; line-height:1.25;}
  .fc .back{display:none; margin-top:8px;}
  .fc.open{background:#fff; border-color:var(--accent);}
  .fc.open .back{display:block;}
  .fc.open .tap{color:var(--accent-dark);}
  .fc .d{font-size:12.5px; color:var(--ink-soft); margin:0 0 6px;}
  .fc .e{font-size:12px; font-style:italic; color:var(--accent-dark); margin:0;}
  .fc .snd{position:absolute; top:12px; right:12px; background:none; border:none; cursor:pointer;
    color:#B3AC98; padding:0;}
  .fc .snd svg{width:15px; height:15px;}
  .fc .snd:hover{color:var(--accent-dark);}
  .fc.ph{border-style:dashed;}

  /* ===== LISTENING ===== */
  .clip{background:var(--paper-soft); border:1.5px solid var(--line); border-radius:var(--radius-card);
    padding:16px; margin-bottom:14px;}
  .clip h4{margin:0 0 4px; font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .clip .who{font-size:12.5px; color:var(--ink-soft); margin:0 0 12px;}
  .clip audio{width:100%; margin-bottom:10px;}
  .rate{display:flex; gap:6px; margin-bottom:12px;}
  .rate button{background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); cursor:pointer;
    padding:6px 12px; border-radius:var(--radius-pill); font-size:11.5px; font-weight:800;}
  .rate button.on{background:var(--accent-dark); border-color:var(--accent-dark); color:#fff;}
  .tts-note{background:#FFF3E9; border:1px solid #FFDCC9; color:var(--coral-dark); font-size:11.5px;
    font-weight:700; border-radius:10px; padding:8px 11px; margin-bottom:10px;}
  .acc{border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; background:#fff;}
  .acc > button{width:100%; text-align:left; background:#fff; border:none; cursor:pointer;
    padding:12px 14px; font-size:13.5px; font-weight:800; color:var(--ink);
    display:flex; align-items:center; gap:10px; line-height:1.4;}
  .acc > button:hover{background:var(--paper);}
  .acc > button .chev{margin-left:auto; transition:transform .2s ease; font-size:11px; color:#B3AC98; flex-shrink:0;}
  .acc.open > button .chev{transform:rotate(180deg);}
  .acc .body{padding:0 14px 13px; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .acc.script > button{color:var(--accent-dark);}

  /* ===== GRAMMAR ===== */
  .gx{background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-card);
    padding:16px; margin-bottom:12px;}
  .gx .q{font-size:14.5px; font-weight:700; margin:0 0 12px; line-height:1.5;}
  .gx .q b{background:var(--paper-soft); border-bottom:2px solid var(--accent); padding:1px 10px; font-weight:800;}
  .opts{display:flex; gap:8px; flex-wrap:wrap;}
  .opts button{background:var(--paper); border:1.5px solid var(--line); color:var(--ink); cursor:pointer;
    padding:9px 15px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:800; transition:all .16s ease;}
  .opts button:hover{border-color:var(--accent-dark);}
  .opts button.ok{background:rgba(18,161,80,.12); border-color:var(--green-ok); color:var(--green-ok);}
  .opts button.no{background:rgba(217,48,37,.1); border-color:var(--red-no); color:var(--red-no);}
  .opts button.dim{opacity:.45;}
  .fb{margin-top:12px; font-size:13px; border-radius:10px; padding:10px 13px; font-weight:700;}
  .fb.ok{background:rgba(18,161,80,.1); color:var(--green-ok); border:1px solid #A9DFC0;}
  .fb.no{background:rgba(217,48,37,.08); color:var(--red-no); border:1px solid #F3B9B4;}
  .g-score{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:800; color:var(--ink-soft); flex-wrap:wrap;}

  /* ===== SPEAKING (bloque mayor) ===== */
  .sp-steps{display:flex; flex-direction:column; gap:9px; margin-bottom:20px;}
  .sp-step{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid #FFDCC9;
    border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:700;}
  .sp-step i{width:24px; height:24px; border-radius:50%; background:var(--coral); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
    flex-shrink:0; font-style:normal;}
  .qcard{background:#fff; border:1.5px solid #FFDCC9; border-radius:var(--radius-card);
    padding:16px; margin-bottom:12px;}
  .qcard .qt{font-size:16px; font-weight:800; margin:0 0 12px; line-height:1.4;}
  .qtools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .btn{display:inline-flex; align-items:center; gap:7px; cursor:pointer; border:none; background:var(--navy);
    color:#fff; padding:9px 15px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:800;
    transition:transform .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn svg{width:14px; height:14px;}
  .btn.coral{background:var(--coral);} .btn.green{background:var(--gt-green-deep);}
  .btn.violet{background:var(--violet);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .sect.dark .btn.ghost{background:rgba(255,255,255,.09); color:#fff; border-color:rgba(255,255,255,.24);}
  .btn.sm{padding:7px 13px; font-size:12px;}
  .timer-pill{display:inline-flex; align-items:center; gap:7px; background:var(--paper-soft);
    border:1.5px solid var(--line); color:var(--ink); padding:8px 14px; border-radius:var(--radius-pill);
    font-size:12.5px; font-weight:800; cursor:pointer; font-variant-numeric:tabular-nums;}
  .timer-pill.run{background:var(--coral); border-color:var(--coral); color:#fff;}
  .sample{background:var(--paper-soft); border-left:3px solid var(--accent); border-radius:0 12px 12px 0;
    padding:13px 15px; font-size:13.5px; line-height:1.65;}
  .sample .lbl{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.9px;
    font-weight:800; color:var(--accent-dark); margin-bottom:5px;}
  .sample em{color:var(--accent-dark); font-style:normal; font-weight:800;}

  /* opine práctica */
  .ocard{background:linear-gradient(165deg,var(--violet-soft),#fff); border:1.5px solid #E2DBFF;
    border-radius:var(--radius-card); padding:16px; margin-bottom:12px;}
  .oc-top{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .oc-av{width:34px; height:34px; border-radius:50%; background:var(--violet); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .oc-name{font-size:11.5px; font-weight:800; color:var(--violet); margin:0; line-height:1.3;}
  .oc-role{font-size:11px; color:var(--ink-soft); margin:0;}
  .oc-q{font-size:14px; font-style:italic; margin:0 0 12px; line-height:1.5;}
  .sl-box{background:#fff; border:1px solid #E2DBFF; border-radius:12px; padding:12px 14px; margin-bottom:11px;}
  .sl-ends{display:flex; justify-content:space-between; gap:12px; font-size:9.5px; text-transform:uppercase;
    letter-spacing:.7px; font-weight:800; color:#B3AC98; margin-bottom:6px;}
  .sl-ends span:last-child{text-align:right;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:999px;
    background:linear-gradient(90deg,var(--coral),#E8DFCE,var(--gt-green)); outline:none; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%;
    background:var(--violet); border:3px solid #fff; box-shadow:0 2px 8px rgba(108,92,231,.45);}
  input[type=range]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--violet);
    border:3px solid #fff; box-shadow:0 2px 8px rgba(108,92,231,.45);}
  .sl-read{display:flex; align-items:baseline; gap:8px; margin-top:8px;}
  .sl-num{font-size:20px; font-weight:800; color:var(--violet); font-variant-numeric:tabular-nums; line-height:1;}
  .sl-word{font-size:12px; font-weight:800; color:var(--ink-soft);}

  /* ===== RECORDER ===== */
  .rec{background:linear-gradient(140deg,#12161F,#1B1030); color:#fff; border-radius:var(--radius-card);
    padding:18px; margin-top:6px;}
  .rec h4{margin:0 0 4px; font-size:15px; font-weight:800;}
  .rec p{margin:0 0 14px; font-size:13px; color:rgba(255,255,255,.7);}
  .rec-row{display:flex; align-items:center; gap:11px; flex-wrap:wrap;}
  .rec-dot{width:11px; height:11px; border-radius:50%; background:#555; flex-shrink:0;}
  .rec-dot.live{background:var(--coral); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .rec audio{width:100%; margin-top:12px;}
  .rec .warn{font-size:11.5px; color:rgba(255,255,255,.5); margin-top:10px;}

  /* ===== CLOSING ===== */
  .close-list{list-style:none; margin:0 0 18px; padding:0;}
  .close-list li{display:flex; align-items:center; gap:11px; padding:11px 13px; margin-bottom:8px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.13); border-radius:12px;
    font-size:14px; font-weight:700;}
  .close-list li .box{width:22px; height:22px; border-radius:7px; border:2px solid rgba(255,255,255,.3);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .close-list li.done .box{background:var(--gt-green); border-color:var(--gt-green);}
  .close-list li.done .box svg{width:13px; height:13px; color:var(--navy);}
  .close-list li.done{color:#fff;}
  .close-list li:not(.done){color:rgba(255,255,255,.5);}
  .close-msg{font-size:16px; font-weight:800; line-height:1.5; margin:0 0 6px;}
  .close-sub{font-size:13.5px; color:rgba(255,255,255,.7); margin:0;}
  .big-num{font-size:44px; font-weight:800; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums;}

  /* ===== FOOTER ===== */
  .foot{position:fixed; bottom:0; left:0; right:0; z-index:45; background:rgba(247,244,236,.95);
    backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:9px 0;}
  .foot-in{max-width:720px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:14px;
    font-size:12px; font-weight:800; color:var(--ink-soft); flex-wrap:wrap;}
  .foot b{color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums;}

  @media (min-width:760px){
    body{font-size:15.5px;}
    .sect{padding:26px 24px;}
  }
  @media print{
    body{background:#fff; padding:0;}
    .top,.foot,.btn,.rate,.fc-tabs,.timer-pill,.rec{display:none !important;}
    .hero,.sect.dark{background:#fff !important; color:#000 !important; border:1px solid #000 !important;}
    .hero h1,.hero p,.hero .kick,.close-msg,.close-sub,.close-list li{color:#000 !important;}
    .fc .back,.acc .body{display:block !important;}
    .sect{break-inside:avoid; page-break-inside:avoid; box-shadow:none; margin:12px 0;}
    .fc,.clip,.gx,.qcard,.ocard,.acc{break-inside:avoid; page-break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <span class="mark">GT</span>
    <b id="topLabel">PRACTICE SESSION</b>
    <span class="lvl" id="topLvl">B1.1</span>
  </div>
  <div class="rail"><div class="fill" id="fill"></div></div>
</div>

<header class="hero">
  <div class="wrap">
    <p class="kick" id="heroKick"></p>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="how" id="heroHow"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="foot">
  <div class="foot-in">
    <span>Progress <b id="fProg">0%</b></span>
    <span>Cards <b id="fCards">0/0</b></span>
    <span>Grammar <b id="fGram">0/0</b></span>
    <span>Answered aloud <b id="fSpoken">0/0</b></span>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   ▼▼▼  ÚNICA ZONA EDITABLE  ▼▼▼
   ===================================================================== */
const PRACTICE = {
  level:"A2.2", accent:"a2",
  label:"SESSION 8 · PRACTICE",
  kicker:"Practice on your own · 25 minutes",
  title:"Month 1 Closing — Full Review",
  subtitle:"Same words, same grammar, no teacher. This is the whole month in one file — say everything out loud.",
  how:"<b>How this works:</b> try to answer <b>before</b> you open anything. Every answer is hidden on purpose. Say it out loud first, then check. If you open the answer first, you are practising reading, not speaking.",

  recall:{
    minutes:6,
    words:[
      {w:"excuse", d:"a reason you give to explain why you did something.", e:"He always has an excuse for being short on cash."},
      {w:"deadline", d:"the last day or time you have to finish something.", e:"We have to meet the deadline on Friday."},
      {w:"loyalty", d:"staying faithful and devoted to someone.", e:"Dogs are famous for their loyalty."},
      {w:"comparison", d:"looking at two things to see how they differ.", e:"The comparison isn't really fair."},
      {w:"trust", d:"the belief that someone is honest and reliable.", e:"Once you break trust, it's hard to get it back."},
      {w:"rule", d:"a guideline you follow, often to protect yourself.", e:"I have a strict rule about lending money."},
      {w:"respect", d:"polite regard for someone's feelings or rights.", e:"She said it with respect, not judgment."},
      {w:"embarrassment", d:"the uncomfortable feeling of being seen doing something wrong.", e:"He felt some embarrassment, but he thanked her anyway."},
      {w:"salary", d:"the fixed amount of money you earn regularly.", e:"His salary went up, but so did the stress."},
      {w:"priority", d:"the thing that matters most to you right now.", e:"Free time became his priority this year."}
    ],
    verbs:[
      {w:"pretend", d:"to act like something is true when it really isn't.", e:"He pretended to be busy when the manager walked by."},
      {w:"notice", d:"to see or realize something.", e:"The supervisor always notices who's really working."},
      {w:"forget", d:"to not remember something.", e:"She forgets how the app works every time."},
      {w:"teach", d:"to help someone learn something new.", e:"I'm trying to teach her the basics."},
      {w:"defend", d:"to support and protect an idea or a person.", e:"She always defends her choice."},
      {w:"compare", d:"to look at two things to see the differences.", e:"Let's compare the cost of both."},
      {w:"lend", d:"to give something, usually money, expecting it back.", e:"I lent him $500 last year."},
      {w:"regret", d:"to feel sorry about a decision you made.", e:"I regret lending him that money."},
      {w:"mention", d:"to say something briefly, often about a sensitive topic.", e:"She finally mentioned it after the meeting."},
      {w:"bring up", d:"to start talking about a topic, often a sensitive one.", e:"It took her weeks to finally bring it up."}
    ],
    phrases:[

const el=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const ACC={a1:["#FFB020","#B8790A"],a2:["#D96A28","#A84A15"],b1:["#00C2A0","#00947A"],b2:["#6C5CE7","#4A3BC7"]};

  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};
function speak(t,rate){ try{ if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=rate||0.9;
  speechSynthesis.speak(u);}catch(e){} }

(function boot(){

(function(){

    ico:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>',
    desc:"Nothing is uploaded anywhere. The recording stays on your device and disappears when you close this page."});
  const box=el("div","rec",'<h4>45-second recording</h4><p>'+R.prompt+'</p>'+
    '<div class="rec-row"><span class="rec-dot" id="rDot"></span>'+
    '<button class="btn coral sm" id="rBtn">'+ICO.mic+' Start recording</button>'+
    '<span id="rTime" style="font-weight:800;font-variant-numeric:tabular-nums">00:00</span></div>'+
    '<audio id="rAudio" controls class="hidden"></audio>'+
    '<p class="warn" id="rWarn"></p>');
  b.appendChild(box);
  let mr=null, chunks=[], iv=null, secs=0, done=false;
  $("#rBtn",box).addEventListener("click",async ()=>{
    if(mr && mr.state==="recording"){
      mr.stop(); return;
    }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; mr=new MediaRecorder(stream);
      mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{
        clearInterval(iv); $("#rDot",box).classList.remove("live");
        $("#rBtn",box).innerHTML=ICO.mic+" Record again";

        stream.getTracks().forEach(t=>t.stop());
        done=true; paint();
      };
      mr.start(); secs=0;
      $("#rDot",box).classList.add("live");
      $("#rBtn",box).innerHTML=ICO.stop+" Stop";
      $("#rTime",box).textContent="00:00";
      iv=setInterval(()=>{ secs++; $("#rTime",box).textContent="00:"+String(secs).padStart(2,"0");
        if(secs>=60 && mr.state==="recording") mr.stop(); },1000);
    }catch(e){
      $("#rWarn",box).textContent="Your browser blocked the microphone. Allow microphone access for this file, or skip this step.";
    }
  });
  STEPS.push({id:"rec", label:"Self-recording", test:()=>done});
})();

/* =====================================================================
   5b · TAKE IT OUTSIDE (real-world transfer — ask OTHER people, not the app)
   ===================================================================== */
(function(){
  const T=PRACTICE.takeOutside; if(!T) return;
  const b=section({id:"outside", num:"Step 6 · Take it outside", title:"Ask Someone Else This Week",
    time:T.minutes+" min", icoBg:"color-mix(in srgb, var(--accent) 12%, transparent)",
    ico:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    desc:T.intro||"Pick at least 2 of these and ask a real person this week — a coworker, a client, someone at home."});
  const g=el("div","oq-grid"); g.style.cssText="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))";
  let asked=0;
  T.questions.forEach((q,i)=>{
    const card=el("div","goal",'<span class="lbl">Question '+(i+1)+'</span><p style="margin:6px 0 10px;font-size:14px;font-weight:700">'+q+'</p>'+
      '<button class="btn ghost sm askedBtn">☐ I asked this</button>');
    const bt=$(".askedBtn",card);
    bt.addEventListener("click",()=>{
      const on=bt.classList.toggle("on");
      bt.textContent = on ? "✓ I asked this" : "☐ I asked this";
      asked += on?1:-1; paint();
    });
    g.appendChild(card);
  });
  b.appendChild(g);
  STEPS.push({id:"outside", label:"Take it outside", test:()=>asked>=2});
})();

/* =====================================================================
   6 · CLOSING
   ===================================================================== */
(function(){
  const C=PRACTICE.closing;
  const b=section({id:"close", num:"Done", title:C.title, dark:true, icoBg:"rgba(255,255,255,.1)",
    ico:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--gt-green)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'});
  const ul=el("ul","close-list"); ul.id="closeList";
  STEPS.forEach(s=>ul.appendChild(el("li",null,'<span class="box">'+ICO.chk+'</span><span>'+s.label+'</span>')));
  b.appendChild(ul);
  b.appendChild(el("div",null,'<p class="big-num" id="bigNum" style="margin:18px 0 2px">0%</p>'+
    '<p style="margin:0 0 16px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:rgba(255,255,255,.5)">of this practice completed</p>'));
  b.appendChild(el("p","close-msg",C.message));
  b.appendChild(el("p","close-sub",C.next));
  paint();
})();
paint();
</script>
